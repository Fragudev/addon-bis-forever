name: Update BiS lists

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # The lists are refreshed on develop, where betas are tagged; main only takes reviewed merges.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      # A source that fails keeps its previous data file and the others are still written. The step's
      # failure is deferred so what succeeded is committed and released, then the job is failed below.
      - name: Refresh lists from every shipped source
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 UpdateForeverBiS.py ForeverBiS

      - name: Bump version, commit and tag
        id: publish
        run: |
          git add --intent-to-add ForeverBiS/ForeverBiS_Data_*.lua
          if git diff --quiet -- 'ForeverBiS/ForeverBiS_Data_*.lua'; then
            echo "Lists unchanged; nothing to release."
            exit 0
          fi
          toc=ForeverBiS/ForeverBiS.toc
          current="$(sed -n 's/^## Version: beta-//p' "$toc" | tr -d '\r')"
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read an X.Y.Z version from '## Version: beta-...' in $toc (got '${current}'); aborting."
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$current"
          next="${major}.${minor}.$((patch + 1))"
          sed -i "s/^## Version: beta-.*/## Version: beta-${next}/" "$toc"
          tag="beta_${next}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForeverBiS/ForeverBiS_Data_*.lua "$toc"
          git commit -m "chore(data): refresh BiS lists from all sources"
          git pull --rebase origin develop
          git tag "$tag"
          git push --atomic origin HEAD:develop "$tag"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"

      # Make a partial failure visible: the job ends red even though the good sources were released.
      - name: Fail when a shipped source failed
        if: always() && steps.refresh.outcome == 'failure'
        run: |
          echo "::error::A shipped source failed to refresh; the others were committed and released (see the refresh step)."
          exit 1

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so call the release directly.
  release:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.update.outputs.tag }}
    secrets: inherit
