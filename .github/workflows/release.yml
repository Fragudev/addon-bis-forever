name: Release

on:
  push:
    tags:
      - "beta_*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fails when the tag and the TOC version disagree (beta_0.0.35 vs beta-0.0.35).
      - name: Build zip
        run: tools/package.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "Forever-${GITHUB_REF_NAME}.zip" \
            --title "Forever BiS ${GITHUB_REF_NAME}" \
            --generate-notes
