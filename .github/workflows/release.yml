name: Release

on:
  push:
    tags:
      - "beta_*"
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (for example beta_0.0.37 or v1.0.0)
        type: string
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CF_PROJECT_ID: "1716165"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # Betas (beta_X.Y.Z) ship from develop. Stable releases (vX.Y.Z) ship from main or from develop, where the
      # Update BiS lists workflow tags every list refresh. A tag on another branch stops here before anything is
      # published. The step also picks the release type used below.
      - name: Check tag branch
        id: kind
        run: |
          case "${TAG}" in
            beta_*) branches="develop"; type=beta ;;
            v*) branches="main develop"; type=release ;;
            *) echo "::error::${TAG} is neither a beta (beta_X.Y.Z) nor a stable (vX.Y.Z) tag."; exit 1 ;;
          esac
          on_branch=""
          for branch in $branches; do
            if git merge-base --is-ancestor HEAD "origin/${branch}"; then
              on_branch="$branch"
              break
            fi
          done
          if [[ -z "$on_branch" ]]; then
            echo "::error::${TAG} is not on ${branches// / or }. ${type^} tags are made there."
            exit 1
          fi
          echo "type=${type}" >>"$GITHUB_OUTPUT"

      # Fails when the tag and the TOC version disagree (beta_0.0.35 vs beta-0.0.35).
      - name: Build zip
        run: tools/package.sh "${TAG}"

      # Betas are prereleases, so the latest stable release stays the one GitHub marks as Latest.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ steps.kind.outputs.type }}
        run: |
          flags=(--generate-notes)
          if [[ "${RELEASE_TYPE}" == beta ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "${TAG}" "Forever-${TAG}.zip" \
            --title "Forever BiS ${TAG}" \
            "${flags[@]}"

      # The CurseForge game version is derived from the TOC Interface (16001 -> 1.60.1) and
      # resolved to its ID. The optional CF_GAME_VERSION_ID repository variable (comma-separated
      # IDs) overrides it. When neither resolves, the step lists the available versions.
      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSION_ID: ${{ vars.CF_GAME_VERSION_ID }}
          RELEASE_TYPE: ${{ steps.kind.outputs.type }}
        run: |
          if [[ -z "${CF_API_TOKEN}" ]]; then
            echo "::error::Missing CF_API_TOKEN repository secret."
            exit 1
          fi
          versions="$(curl -fsS -H "X-Api-Token: ${CF_API_TOKEN}" https://wow.curseforge.com/api/game/versions)"
          if [[ -z "${CF_GAME_VERSION_ID}" ]]; then
            interface="$(sed -n 's/^## Interface://p' ForeverBiS/ForeverBiS.toc | grep -o '[0-9]\+' | head -n 1)"
            game_version="$((interface / 10000)).$((interface / 100 % 100)).$((interface % 100))"
            CF_GAME_VERSION_ID="$(jq -r --arg name "${game_version}" \
              '[.[] | select(.name == $name) | .id] | if length == 1 then .[0] else empty end' <<<"${versions}")"
            echo "Interface ${interface} -> CurseForge game version ${game_version} (ID '${CF_GAME_VERSION_ID}')"
          fi
          if ! jq -e --arg ids "${CF_GAME_VERSION_ID}" \
            '($ids | split(",") | map(select(test("^ *[0-9]+ *$")) | tonumber)) as $wanted
             | ($wanted | length) > 0 and ($wanted | length) == ($ids | split(",") | length)
             and ([.[].id] as $known | all($wanted[]; IN($known[])))' <<<"${versions}" >/dev/null; then
            echo "::error::Could not resolve a unique CurseForge game version (ID '${CF_GAME_VERSION_ID}'). Set CF_GAME_VERSION_ID to one of these IDs:"
            jq -r '.[] | "\(.id)\t\(.name)\t(type \(.gameVersionTypeID))"' <<<"${versions}" | tail -n 40
            exit 1
          fi
          # Changelog: user-facing commits (feat/fix/perf) that touch the addon folder since the
          # previous release of the same type. Workflow, tooling and packaging changes never reach CurseForge.
          # The first stable release lists the changes since the last beta it contains.
          if [[ "${RELEASE_TYPE}" == beta ]]; then
            previous="$(git describe --tags --abbrev=0 --match 'beta_*' "${TAG}^" 2>/dev/null || true)"
          else
            previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null \
              || git describe --tags --abbrev=0 --match 'beta_*' "${TAG}^" 2>/dev/null || true)"
          fi
          changelog="$(git log --no-merges --format='%s' ${previous:+"${previous}..${TAG}"} -- ForeverBiS/ \
            | grep -E '^(feat|fix|perf)(\([^)]*\))?!?: ' \
            | sed -E 's/^(feat|fix|perf)(\([^)]*\))?!?: (.*)/- \1: \3/' || true)"
          if [[ -z "${changelog}" ]]; then
            changelog="Updated BiS lists."
          fi
          metadata="$(jq -n \
            --arg name "Forever BiS ${TAG}" \
            --arg log "${changelog}" \
            --arg type "${RELEASE_TYPE}" \
            --argjson versions "[${CF_GAME_VERSION_ID}]" \
            '{displayName: $name, changelog: $log, changelogType: "markdown", releaseType: $type, gameVersions: $versions}')"
          # --fail-with-body keeps CurseForge's error message in the log. The metadata goes as
          # --form-string because -F cuts the value at the first ';' in the changelog.
          curl -sS --fail-with-body -H "X-Api-Token: ${CF_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            -F "file=@Forever-${TAG}.zip" \
            "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"
