name: Update BiS lists

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      # The lists are refreshed on main and every change ships as a stable release (vX.Y.Z), so the CurseForge
      # app offers it to every player, not only those who opted into betas. develop is synced afterwards.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # A source that fails keeps its previous data file and the others are still written. The step's
      # failure is deferred so what succeeded is committed and released, then the job is failed below.
      - name: Refresh lists from every shipped source
        id: refresh
        continue-on-error: true
        run: python3 UpdateForeverBiS.py ForeverBiS

      # The stable version lives only in the tag: tools/package.sh writes it into the packaged TOC, and the
      # repository TOC keeps the beta version that develop bumps.
      - name: Commit and tag a stable release
        id: publish
        run: |
          git add --intent-to-add ForeverBiS/ForeverBiS_Data_*.lua
          if git diff --quiet -- 'ForeverBiS/ForeverBiS_Data_*.lua'; then
            echo "Lists unchanged; nothing to release."
            exit 0
          fi
          current="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ -z "$current" ]]; then
            echo "::error::No stable tag (vX.Y.Z) found to bump; aborting."
            exit 1
          fi
          IFS=. read -r major minor patch <<<"${current#v}"
          tag="v${major}.${minor}.$((patch + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ForeverBiS/ForeverBiS_Data_*.lua
          git commit -m "chore(data): refresh BiS lists"
          git pull --rebase origin main
          git tag "$tag"
          git push --atomic origin HEAD:main "$tag"
          echo "Released ${tag} (previous ${current})."
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"

      # Keeps develop from falling behind the lists main shipped. The data files are regenerated whole, so a conflict
      # in them takes main's (just released) version. Any other conflict only warns: the release is already out, and
      # the merge can be done by hand.
      - name: Sync develop with main
        if: steps.publish.outputs.tag != ''
        continue-on-error: true
        run: |
          git fetch origin main develop
          git checkout -B develop origin/develop
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$conflicts" ]] && ! grep -qv '^ForeverBiS/ForeverBiS_Data_[^/]*\.lua$' <<<"$conflicts"; then
              mapfile -t files <<<"$conflicts"
              git checkout --theirs -- "${files[@]}"
              git add -- "${files[@]}"
              git commit --no-edit
            else
              git merge --abort
              echo "::warning::Could not merge main into develop (conflicts: ${conflicts//$'\n'/, }); merge it by hand."
              exit 1
            fi
          fi
          git push origin develop

      # Make a partial failure visible: the job ends red even though the good sources were released.
      - name: Fail when a shipped source failed
        if: always() && steps.refresh.outcome == 'failure'
        run: |
          echo "::error::A shipped source failed to refresh; the others were committed and released (see the refresh step)."
          exit 1

  # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so call the release directly.
  release:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.update.outputs.tag }}
    secrets: inherit
